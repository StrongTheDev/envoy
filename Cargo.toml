[package]
name = "envoy-windows"
version = "0.1.1"
edition = "2024"
description = "Envoy - Windows environment variable manager"
repository = "https://github.com/StrongTheDev/envoy"
license-file = "LICENSE.txt"
keywords = ["env-variables", "windows", "egui", "path", "registry"]
categories = ["gui", "config", "os::windows-apis"]

[[bin]]
name = "Envoy"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
eframe = "0.37.0"
egui = "0.37"
egui_extras = { version = "0.37.0", features = ["svg"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry"] }
winreg = "0.56.0"

[build-dependencies]
winres = "0.1.12"
